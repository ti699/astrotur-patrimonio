services:
  postgres:
    image: postgres:16-alpine
    container_name: patrimonio_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patrimonio_api
    restart: always
    ports:
      - "${BACKEND_PORT}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://187.127.0.219:3001/api
        REACT_APP_API_URL: http://187.127.0.219:3001/api
    container_name: patrimonio_web
    restart: always
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      - VITE_API_URL=http://187.127.0.219:3001/api
      - REACT_APP_API_URL=http://187.127.0.219:3001/api

volumes:
  pgdata: